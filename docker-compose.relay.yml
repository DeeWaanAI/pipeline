# ───────────────────────────────────────────────────────────────────
#  ON-PREM RELAY CONNECTOR (Phase 3) — outbound-only
# ───────────────────────────────────────────────────────────────────
# Runs relay/connector.mjs inside a minimal Node container on the customer's
# premises. Outbound-only: it makes HTTPS calls to CLOUD_URL and HTTP calls to
# LOCAL_URL but publishes NO inbound ports, so it works behind strict
# egress-only / NAT networks and satisfies data-residency requirements.
#
# Usage:
#   export CLOUD_URL=https://app.example.com
#   export RELAY_TOKEN=<token from POST /api/relay/register>
#   export LOCAL_URL=http://host.docker.internal:3000   # your on-prem service
#   docker compose -f docker-compose.relay.yml up -d
#
# Notes:
# - `extra_hosts` maps host.docker.internal → the Docker host on Linux too
#   (it's built-in on Docker Desktop), so LOCAL_URL can point at a service on
#   the host. Use a container network / service name instead if your local
#   service is itself containerized.
# - No `ports:` block — intentionally. There is nothing to reach in.
services:
  relay:
    image: node:20-alpine
    container_name: swarm-relay
    working_dir: /relay
    volumes:
      # Mount the connector read-only; no build step, no extra deps.
      - ./relay:/relay:ro
    command: ["node", "connector.mjs"]
    environment:
      CLOUD_URL: ${CLOUD_URL:?set CLOUD_URL to your cloud app origin (e.g. https://app.example.com)}
      RELAY_TOKEN: ${RELAY_TOKEN:?set RELAY_TOKEN from POST /api/relay/register}
      LOCAL_URL: ${LOCAL_URL:-http://host.docker.internal:3000}
      POLL_WAIT: ${POLL_WAIT:-25}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
