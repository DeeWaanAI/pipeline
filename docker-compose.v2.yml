# app25_v2 local stack — deliberately distinct names/ports/volumes from the
# original "app 25" project (app25 compose project uses swarm-mysql:3306,
# swarm-redis:6379). v2 uses v2-* names and ports 3307/6380 so the two
# workspaces can never share a database volume by accident.
services:
  mysql:
    image: mysql:8.0
    container_name: v2-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: swarm
      MYSQL_USER: swarm
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-swarmpass}
    ports:
      - "3307:3306"
    volumes:
      - v2-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: v2-redis
    ports:
      - "6380:6379"
    volumes:
      - v2-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  v2-mysql-data:
  v2-redis-data:
