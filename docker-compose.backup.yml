# ───────────────────────────────────────────────────────────────────
#  MYSQL BACKUP SCHEDULER — self-contained daily dump loop
# ───────────────────────────────────────────────────────────────────
# Runs scripts/backup-cron.sh inside a mysql:8.0 container. The image
# already ships mysqldump, so there is NO build step — the repo's
# scripts/ directory is mounted read-only and the stock entrypoint is
# replaced with the backup loop.
#
# Dumps land in ./backups on the host (gzipped, 7-day retention — see
# scripts/backup-db.sh header for restore instructions).
#
# Usage:
#   export DATABASE_URL=mysql://user:pass@host:3306/dbname
#   docker compose -f docker-compose.backup.yml up -d
#   docker compose -f docker-compose.backup.yml logs -f backup   # watch runs
#   docker compose -f docker-compose.backup.yml down             # stop
#
# Railway MySQL: point DATABASE_URL at the PUBLIC TCP endpoint
# (MySQL service → Settings → Networking → enable public TCP, then copy
# MYSQL_PUBLIC_URL from the Variables tab). Alternatively run this
# compose file inside the same network and use the private URL.
#
# Env:
#   DATABASE_URL            (required — no default; compose fails fast without it)
#   BACKUP_INTERVAL_SECONDS (optional) seconds between runs. Default 86400 (24h)
#
# Notes:
# - No `ports:` block — intentionally. This service only makes outbound
#   MySQL connections and writes files to the mounted volume.
# - The first backup runs immediately at container start; check
#   `logs -f backup` for the "[backup-cron] backup run OK" line.
services:
  backup:
    image: mysql:8.0
    container_name: swarm-backup
    volumes:
      # Scripts read-only; dumps written to ./backups on the host.
      - ./scripts:/scripts:ro
      - ./backups:/backups
    environment:
      DATABASE_URL: "${DATABASE_URL:?set DATABASE_URL to mysql://user:pass@host:port/dbname — for Railway use the public TCP endpoint URL}"
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    # Replace the stock docker-entrypoint entirely — no mysqld here.
    entrypoint: ["bash", "/scripts/backup-cron.sh"]
    restart: unless-stopped
