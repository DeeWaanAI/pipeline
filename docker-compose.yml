services:
  mysql:
    image: mysql:8.0
    container_name: swarm-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: swarm
      MYSQL_USER: swarm
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-swarmpass}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Uncomment for local app development:
  # app:
  #   build: .
  #   container_name: swarm-app
  #   depends_on:
  #     mysql:
  #       condition: service_healthy
  #   environment:
  #     DATABASE_URL: mysql://swarm:${MYSQL_PASSWORD:-swarmpass}@mysql:3306/swarm
  #     NODE_ENV: production
  #     PORT: 3000
  #   ports:
  #     - "3000:3000"
  #   env_file:
  #     - .env

  redis:
    image: redis:7-alpine
    container_name: swarm-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  mysql-data:
  redis-data:
