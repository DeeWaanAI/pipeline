name: DB Backup (MySQL → S3/R2)

on:
  schedule:
    # Weekly, Sunday 03:41 UTC (off-peak minute)
    - cron: "41 3 * * 0"
  workflow_dispatch: {} # manual run button

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Dump production database
        env:
          MYSQL_PUBLIC_URL: ${{ secrets.MYSQL_PUBLIC_URL }}
        run: |
          # MYSQL_PUBLIC_URL format: mysql://USER:PASSWORD@HOST:PORT/DBNAME
          # (Railway → MySQL service → Connect → Public Network URL)
          PARSED=$(echo "$MYSQL_PUBLIC_URL" | sed -E 's|mysql://([^:]+):([^@]+)@([^:]+):([0-9]+)/(.+)|\1 \2 \3 \4 \5|')
          read -r DB_USER DB_PASS DB_HOST DB_PORT DB_NAME <<< "$PARSED"
          mysqldump \
            -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" -p"$DB_PASS" \
            --single-transaction --routines --triggers \
            "$DB_NAME" | gzip > "deewaanai-backup-$(date +%Y%m%d-%H%M).sql.gz"
          ls -lh deewaanai-backup-*.sql.gz

      - name: Upload to S3/R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}       # e.g. https://<accountid>.r2.cloudflarestorage.com (R2) — leave blank for AWS S3
          S3_BUCKET: ${{ secrets.S3_BUCKET }}           # e.g. deewaanai-backups
        run: |
          FILE=$(ls deewaanai-backup-*.sql.gz)
          if [ -n "$S3_ENDPOINT" ]; then
            aws s3 cp "$FILE" "s3://$S3_BUCKET/$FILE" --endpoint-url "$S3_ENDPOINT"
          else
            aws s3 cp "$FILE" "s3://$S3_BUCKET/$FILE" --region us-east-1
          fi
          echo "Uploaded $FILE to s3://$S3_BUCKET/"
